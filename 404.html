<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script>
        // Mapping of custom QR paths to the target page
        const redirects = {
            "/roman-flowers-fauna-qr": "/pages/garden",
            "/roman-flowers-fauna-qr/": "/pages/garden",
            "/roman-faith-qr": "/pages/garden",
            "/roman-faith-qr/": "/pages/garden"
        };

        const path = window.location.pathname;

        if (redirects[path]) {
            // Instant redirect if path matches
            window.location.replace(redirects[path]);
        }
    </script>
    <title>Page Not Found</title>
</head>
<body>
    <h1>404 - Page Not Found</h1>
    <p>Sorry, the page you are looking for does not exist. Return to <a href="/">Home</a>.</p>
</body>
</html>
